<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy (meta) to allow necessary CDN for optional source maps
      This is a conservative addition to permit cdnjs.cloudflare.com for scripts/connect
      Note: If your hosting environment sets CSP response headers, that will override this meta tag
      In that case add the same directive server-side (see backend/server.ts example below).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://api.supabase.com https://auth.supabase.io https://*.supabase.co https://cdnjs.cloudflare.com; connect-src 'self' https://api.supabase.com https://auth.supabase.io https://*.supabase.co https://cdnjs.cloudflare.com ws: wss:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;">
    <title>Ibn Al Arab Restaurant</title>
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
